<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PortfolioLattaphon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- เพิ่ม Layer พื้นหลัง -->
        <div id="bg-layer" class="bg-layer initial"></div>
        <!-- หัวข้อ -->
        <header>
            <h1 class="neon-title">Portfolio of<br><span class="name">Game Developer</span><span class="subname"></span></h1>
        </header>
        <div class="page-indicator">
            <span class="page-number" data-page="0">ME</span>
            <span class="page-number" data-page="1">1</span>
            <span class="page-number" data-page="2">2</span>
            <span class="page-number" data-page="3">3</span>
            <span class="page-number" data-page="4">4</span>
          </div>
        <!-- หน้าต่างเนื้อหา -->
        <div id="page-content" class="page-content">
            <!-- เนื้อหาจะถูกโหลดโดย JavaScript -->
        </div>
        <!-- ลูกศรเปลี่ยนหน้า -->
        <div class="navigation">
            <button id="prev-btn" class="nav-arrow hidden">◀</button>
            <button id="next-btn" class="nav-arrow">▶</button>
        </div>

        <!-- ตัวละครวงรี -->
        <div class="character-container">
            <img id="character" src="assets/Animation/idle.png" alt="Character" class="character">
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
